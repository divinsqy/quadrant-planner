name: v1 branch CI

on:
  push:
    branches:
      - v1-rewrite

permissions:
  contents: read

concurrency:
  group: v1-rewrite-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Diagnose Dashboard tests
        run: timeout 30s flutter test test/features/dashboard/dashboard_page_test.dart --plain-name "Profile Settings persists an edited nickname" -r expanded

      - name: Test
        run: flutter test -r expanded

      - name: Analyze
        run: flutter analyze
