name: quadrant_planner
description: Quadrant Planner desktop application
publish_to: "none"
version: 0.8.0+8

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1
  uuid: ^4.6.0
  file_selector: ^1.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/calendars/
